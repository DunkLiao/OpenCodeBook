blockers: []

resolved_blockers:
  - id: "BLOCK-001"
    severity: "blocking"
    title: "模組目錄 platform/ 會遮蔽 Python 標準庫 platform 模組"
    detail: >
      PRD §8.2 將平台抽象層命名為 platform/。當專案根目錄位於 sys.path 首位時，
      import platform 會解析到本專案套件而非標準庫，導致依賴標準庫 platform 的套件失效。
    evidence: >
      實測：於含 platform/__init__.py 的目錄執行 python -m pytest -q，
      立即以 AttributeError: module 'platform' has no attribute 'python_implementation' 崩潰；
      Python 並主動提示該目錄應重新命名。dependency 掃描顯示 _pytest/terminal.py、
      attrs、zmq、astropy、botocore 等大量套件皆 import platform。
    impact: >
      NFR-011 與 PRD §13 要求以 pytest 驗證；若不修正，M1 起即無法執行測試，
      且每次測試或工具鏈升級都可能再度踩雷。
    proposed_resolution: "將 platform/ 更名為 platform_api/"
    requirement_ids: ["NFR-006", "NFR-011", "NFR-018"]
    status: "resolved"
    resolved_at: "2026-09-28"
    resolution: >
      使用者核准後，PRD v1.1 已將 platform/ 更名為 platform_api/（附錄 B.5 第 24 項），
      並同步更新 NFR-006、§8.2 模組分層與 §14 M1。PRD 全文已無以 platform/ 作為套件路徑的引用。
    blocks: []

