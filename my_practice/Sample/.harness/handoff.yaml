decisions:
  - decision: "平台抽象層目錄為 platform_api/（不可使用 platform/）"
    reason: >
      BLOCK-001：platform/ 會遮蔽標準庫 platform 模組。實測於含 platform/__init__.py 的目錄執行
      pytest 會直接崩潰（AttributeError: module 'platform' has no attribute 'python_implementation'），
      違反 NFR-011 與 PRD §13。已寫入 PRD §8.2 / NFR-006 / 附錄 D D-000。
    requirement_ids: ["NFR-006", "NFR-011", "NFR-018"]
    status: "已核准並生效（PRD v1.1）"
  - decision: "D-000 平台抽象層命名 platform_api/"
    reason: "標準庫 platform 遮蔽問題"
    requirement_ids: ["NFR-006"]
    status: "已生效"
  - decision: "D-001 設定範圍與預設值：面板寬 280–480（預設 360）、按鈕 32–96 px（預設 56）、透明度 0.3–1.0（預設 1.0）、按鈕與面板間距 8 px、預設位置主要螢幕右上角距邊 24 px"
    reason: "FR-010.6 要求夾限但未定義範圍；AC-028/AC-050 需要可驗證數值"
    requirement_ids: ["FR-010", "FR-001", "FR-002"]
    status: "已生效"
  - decision: "D-002 字串抽離：ui/strings.py 的 zh-TW 具名常數字串表，不引入 i18n 框架"
    reason: "C-006 僅抽離、不翻譯；且不新增依賴"
    requirement_ids: ["C-006"]
    status: "已生效"
  - decision: "D-003 資源置於 assets/（托盤 .ico、按鈕圖示、執行檔 icon）"
    reason: "§8.2 未定義資源位置"
    requirement_ids: ["FR-011", "FR-001"]
    status: "已生效"
  - decision: "D-004 應用程式識別碼 py_assistant_desktop（資料目錄、單一實例鎖名、開機自啟登錄值名稱）；執行檔名稱 FloatingAssistant.exe"
    reason: "FR-012.2 / FR-013.1 需穩定具名識別碼；名稱由使用者在附錄 B.5 裁定"
    requirement_ids: ["FR-012", "FR-013", "FR-014"]
    status: "已生效（執行檔名稱：FloatingAssistant.exe）"
  - decision: "D-005 手動觸發的重新整理（卡片按鈕、托盤『立即重新整理』）不受『面板收合時暫停』限制；僅定時抓取受限（AC-019 已同步限縮為『定時抓取』）"
    reason: "FR-006.4 / FR-011.2 與 FR-006.5 / FR-007.8 字面衝突；使用者主動意圖優先"
    requirement_ids: ["FR-006", "FR-007", "FR-011"]
    status: "已生效"
  - decision: "D-006 第二次啟動喚醒既有實例時：確保按鈕可見並置頂，且展開面板"
    reason: "FR-013.2『將現有按鈕與面板帶到前景』"
    requirement_ids: ["FR-013"]
    status: "已生效"
  - decision: "D-007 新增待辦插入未完成區頂部（order 最小）"
    reason: "FR-009.7 未定義插入位置；使用者於附錄 B.5 裁定為頂部"
    requirement_ids: ["FR-009"]
    status: "已生效（使用者裁定：頂部）"
  - decision: "D-008 點擊清單中的筆記即展開該筆就地編輯區；同一時間僅一筆展開"
    reason: "FR-008.5 定義了就地編輯但未定義開啟互動"
    requirement_ids: ["FR-008"]
    status: "已生效"
  - decision: "D-009 設定視窗為 application-modal 單一視窗；面板可見時以面板為母視窗，由托盤開啟且面板已收合時不指定母視窗"
    reason: "FR-010.1 允許由托盤開啟，但 FR-010.4 要求模態"
    requirement_ids: ["FR-010"]
    status: "已生效"
  - decision: "D-010 .corrupt-* 備份檔啟動時僅保留最近 5 份"
    reason: "FR-014.4 未定義清理機制"
    requirement_ids: ["FR-014"]
    status: "已生效"
  - decision: "D-011 磁碟清單用 psutil.disk_partitions(all=False) 並排除 fstype 含 cdrom/removable 者"
    reason: "FR-007.5『本機固定磁碟』判定方式未定義"
    requirement_ids: ["FR-007"]
    status: "已生效"
  - decision: "D-012 CPU 首次取樣丟棄首值（cpu_percent(interval=None)）"
    reason: "psutil 首次呼叫必回 0，會誤顯示"
    requirement_ids: ["FR-007"]
    status: "已生效"
  - decision: "D-013 12 小時制邊界：00:xx → 12:xx AM；12:xx → 12:xx PM"
    reason: "FR-004.1 未定義午夜/正午邊界"
    requirement_ids: ["FR-004"]
    status: "已生效"
  - decision: "D-014 托盤『顯示/隱藏面板』與浮動按鈕 toggle 共用同一面板展開狀態"
    reason: "避免兩處狀態不一致"
    requirement_ids: ["FR-002", "FR-011"]
    status: "已生效"
  - decision: "D-015 RSS『快取已過期』以最後成功更新時間 + 設定間隔判定（非請求發起時間）"
    reason: "FR-006.3 未定義判定基準"
    requirement_ids: ["FR-006"]
    status: "已生效"
  - decision: "高 DPI 採 Qt6 預設 PassThrough，保留可覆寫 HighDpiScaleFactorRoundingPolicy 的設定點"
    reason: "NFR-007 要求 100%–200% 不縮放模糊；Qt6 預設已足夠"
    requirement_ids: ["NFR-007"]
    status: "已生效"
  - decision: "背景工作以 typing.Protocol 定義注入介面（FeedFetcher、SystemProvider）"
    reason: "NFR-011 要求可 mock；PRD 未定義簽章。實作時落地並記錄"
    requirement_ids: ["NFR-011", "NFR-005"]
    status: "待實作時落地"
  - decision: "納入 Git 版控：git init -b main、origin = https://github.com/DunkLiao/py_assistant_desktop.git、建立 Python 專用 .gitignore"
    reason: >
      使用者提供遠端 URL 並要求 commit & push；遠端倉庫為空（ls-remote 無 ref），無 non-fast-forward 風險。
      Git 身分已設定（DunkLiao / dicksskimo@yahoo.com.tw）。此決策使 PRD C-007 的原描述過時，故一併修正為 v1.2。
    requirement_ids: ["C-007"]
    status: "已生效"

