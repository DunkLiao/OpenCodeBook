      推送至 origin/main；並將 PRD 更新為 v1.2 以修正 C-007 的版控狀態描述。
  規劃階段已完成（planning.status = complete）；current_phase 已切換為 implementation，
  但 implementation.status = not_started（尚未開始寫程式）。

