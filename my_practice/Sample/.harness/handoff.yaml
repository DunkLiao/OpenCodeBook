do_not_assume:
  - "不要建立名為 platform（或任何與標準庫模組同名）的套件或目錄。"
  - "不要假設使用者已授權開始實作；目前 implementation.status = not_started，應先取得指示。"
  - "不要為了讓測試通過而修改 PRD；需求變更一律先取得使用者核准。"
  - "不要新增 PRD 未列出的功能（到期日、標籤、Markdown、已讀狀態、全域快速鍵、卡片顯示/隱藏開關、可攜模式、多語言）。"
  - "不要使用全域滑鼠/鍵盤 hook（C-002）。"
  - "不要假設資料需加密或需雲端同步（SEC-007、NG-001）。"
  - "不要假設 macOS/Linux 需要實作或驗證（NG-004）。"
  - "不要把平台專屬 API 直接寫進 core/（NFR-006 / NFR-018）。"
